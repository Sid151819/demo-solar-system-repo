<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Solar System Simulator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #050b1e, #000);
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: -200%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 70% 60%, white, transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, white, transparent);
            animation: drift 140s linear infinite;
            opacity: 0.6;
        }

        @keyframes drift {
            to {
                transform: translate(300px, 300px);
            }
        }

        .universe {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffd700, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 90px 35px rgba(255, 140, 0, 0.7);
        }

        /* Orbits */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate linear infinite;
        }

        @keyframes rotate {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .mercury {
            width: 220px;
            height: 220px;
            animation-duration: 20s;
        }

        .venus {
            width: 320px;
            height: 320px;
            animation-duration: 35s;
        }

        .earth {
            width: 420px;
            height: 420px;
            animation-duration: 50s;
        }

        .mars {
            width: 520px;
            height: 520px;
            animation-duration: 70s;
        }

        .jupiter {
            width: 700px;
            height: 700px;
            animation-duration: 100s;
        }

        .saturn {
            width: 860px;
            height: 860px;
            animation-duration: 130s;
        }

        .uranus {
            width: 1020px;
            height: 1020px;
            animation-duration: 160s;
        }

        .neptune {
            width: 1180px;
            height: 1180px;
            animation-duration: 190s;
        }

        /* Planet + label wrapper */
        .body {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .planet {
            margin: auto;
            border-radius: 50%;
            cursor: pointer;
        }

        .label {
            margin-top: 6px;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .labels-on .label {
            opacity: 0.85;
        }

        /* Planet styles */
        .mercury .planet {
            width: 10px;
            height: 10px;
            background: #aaa;
        }

        .venus .planet {
            width: 18px;
            height: 18px;
            background: #d4af37;
        }

        .earth .planet {
            width: 20px;
            height: 20px;
            background: #2e86de;
        }

        .mars .planet {
            width: 14px;
            height: 14px;
            background: #c0392b;
        }

        .jupiter .planet {
            width: 36px;
            height: 36px;
            background: linear-gradient(#d2b48c, #b87333);
        }

        .saturn .planet {
            width: 30px;
            height: 30px;
            background: #d2b48c;
            position: relative;
        }

        .saturn .planet::before {
            content: "";
            position: absolute;
            width: 60px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(20deg);
        }

        .uranus .planet {
            width: 24px;
            height: 24px;
            background: #7fdbda;
        }

        .neptune .planet {
            width: 24px;
            height: 24px;
            background: #4169e1;
        }

        /* Controls */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        button {
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #777;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="universe labels-on" id="universe">
        <div class="sun"></div>

        <div class="orbit mercury">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Mercury</div>
            </div>
        </div>

        <div class="orbit venus">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Venus</div>
            </div>
        </div>

        <div class="orbit earth">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Earth</div>
            </div>
        </div>

        <div class="orbit mars">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Mars</div>
            </div>
        </div>

        <div class="orbit jupiter">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Jupiter</div>
            </div>
        </div>

        <div class="orbit saturn">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Saturn</div>
            </div>
        </div>

        <div class="orbit uranus">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Uranus</div>
            </div>
        </div>

        <div class="orbit neptune">
            <div class="body">
                <div class="planet"></div>
                <div class="label">Neptune</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleLabels()">🏷️ Toggle Labels</button>
    </div>

    <script>
        function toggleLabels() {
            document.getElementById("universe")
                .classList.toggle("labels-on");
        }
    </script>

</body>

</html>
