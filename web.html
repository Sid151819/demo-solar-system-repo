<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Solar System Simulator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #050b1e, #000);
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: -200%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 70% 60%, white, transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, white, transparent);
            animation: drift 140s linear infinite;
            opacity: 0.6;
        }

        @keyframes drift {
            to {
                transform: translate(300px, 300px);
            }
        }

        .universe {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffd700, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 90px 35px rgba(255, 140, 0, 0.7);
        }

        /* Orbits */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate linear infinite;
        }

        @keyframes rotate {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .mercury {
            width: 220px;
            height: 220px;
            animation-duration: 20s;
        }

        .venus {
            width: 320px;
            height: 320px;
            animation-duration: 35s;
        }

        .earth {
            width: 420px;
            height: 420px;
            animation-duration: 50s;
        }

        .mars {
            width: 520px;
            height: 520px;
            animation-duration: 70s;
        }

        /* Asteroid belt */
        .belt {
            width: 600px;
            height: 600px;
            animation-duration: 110s;
        }

        .asteroid {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #888;
            border-radius: 50%;
        }

        .jupiter {
            width: 700px;
            height: 700px;
            animation-duration: 100s;
        }

        .saturn {
            width: 860px;
            height: 860px;
            animation-duration: 130s;
        }

        .uranus {
            width: 1020px;
            height: 1020px;
            animation-duration: 160s;
        }

        .neptune {
            width: 1180px;
            height: 1180px;
            animation-duration: 190s;
        }

        /* Planets */
        .planet {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: pointer;
        }

        .mercury .planet {
            width: 10px;
            height: 10px;
            background: #aaa;
        }

        .venus .planet {
            width: 18px;
            height: 18px;
            background: #d4af37;
        }

        .earth .planet {
            width: 20px;
            height: 20px;
            background: #2e86de;
        }

        .mars .planet {
            width: 14px;
            height: 14px;
            background: #c0392b;
        }

        .jupiter .planet {
            width: 36px;
            height: 36px;
            background: linear-gradient(#d2b48c, #b87333);
        }

        .saturn .planet {
            width: 30px;
            height: 30px;
            background: #d2b48c;
            position: relative;
        }

        .saturn .planet::before {
            content: "";
            position: absolute;
            width: 60px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(20deg);
        }

        .uranus .planet {
            width: 24px;
            height: 24px;
            background: #7fdbda;
        }

        .neptune .planet {
            width: 24px;
            height: 24px;
            background: #4169e1;
        }

        /* Popup */
        .popup {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            place-items: center;
        }

        .popup-content {
            background: #0b1225;
            padding: 30px;
            border: 1px solid #444;
            width: 300px;
            text-align: center;
        }

        .popup button {
            margin-top: 20px;
            padding: 8px 16px;
            background: none;
            border: 1px solid #777;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="universe">

        <div class="sun"></div>

        <div class="orbit mercury">
            <div class="planet" onclick="openPopup('Mercury','Smallest and closest to the Sun')"></div>
        </div>
        <div class="orbit venus">
            <div class="planet" onclick="openPopup('Venus','Hottest planet with thick clouds')"></div>
        </div>
        <div class="orbit earth">
            <div class="planet" onclick="openPopup('Earth','Only known planet with life')"></div>
        </div>
        <div class="orbit mars">
            <div class="planet" onclick="openPopup('Mars','Cold red desert world')"></div>
        </div>

        <!-- Asteroid Belt -->
        <div class="orbit belt">
            <div class="asteroid" style="top:10%;left:60%"></div>
            <div class="asteroid" style="top:40%;left:20%"></div>
            <div class="asteroid" style="top:70%;left:80%"></div>
            <div class="asteroid" style="top:30%;left:90%"></div>
            <div class="asteroid" style="top:80%;left:30%"></div>
        </div>

        <div class="orbit jupiter">
            <div class="planet" onclick="openPopup('Jupiter','Largest gas giant')"></div>
        </div>
        <div class="orbit saturn">
            <div class="planet" onclick="openPopup('Saturn','Famous for its rings')"></div>
        </div>
        <div class="orbit uranus">
            <div class="planet" onclick="openPopup('Uranus','Ice giant with tilted axis')"></div>
        </div>
        <div class="orbit neptune">
            <div class="planet" onclick="openPopup('Neptune','Fastest winds in the solar system')"></div>
        </div>

    </div>

    <!-- Popup -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <h2 id="pName"></h2>
            <p id="pInfo"></p>
            <button onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        function openPopup(name, info) {
            document.getElementById("pName").textContent = name;
            document.getElementById("pInfo").textContent = info;
            document.getElementById("popup").style.display = "grid";
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
        }
    </script>

</body>

</html>
