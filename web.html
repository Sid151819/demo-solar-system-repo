<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Solar System Simulator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #050b1e, #000);
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* 🌠 Stars */
        .stars {
            position: absolute;
            inset: -200%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(1px 1px at 70% 60%, white, transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, white, transparent),
                radial-gradient(1px 1px at 90% 20%, white, transparent);
            animation: drift 120s linear infinite;
            opacity: 0.7;
        }

        @keyframes drift {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(200px, 200px);
            }
        }

        .universe {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ☀️ Sun */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffd700, #ff8c00);
            border-radius: 50%;
            box-shadow: 0 0 80px 30px rgba(255, 140, 0, 0.7);
        }

        /* 🪐 Orbits */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate linear infinite;
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Orbit sizes + speed */
        .mercury {
            width: 220px;
            height: 220px;
            animation-duration: 20s;
        }

        .venus {
            width: 320px;
            height: 320px;
            animation-duration: 35s;
        }

        .earth {
            width: 420px;
            height: 420px;
            animation-duration: 50s;
        }

        .mars {
            width: 520px;
            height: 520px;
            animation-duration: 70s;
        }

        .jupiter {
            width: 650px;
            height: 650px;
            animation-duration: 100s;
        }

        .saturn {
            width: 800px;
            height: 800px;
            animation-duration: 130s;
        }

        .uranus {
            width: 950px;
            height: 950px;
            animation-duration: 160s;
        }

        .neptune {
            width: 1100px;
            height: 1100px;
            animation-duration: 190s;
        }

        /* 🌍 Planets */
        .planet {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .mercury .planet {
            width: 10px;
            height: 10px;
            background: #aaa;
        }

        .venus .planet {
            width: 18px;
            height: 18px;
            background: #d4af37;
        }

        .earth .planet {
            width: 20px;
            height: 20px;
            background: #2e86de;
        }

        .mars .planet {
            width: 14px;
            height: 14px;
            background: #c0392b;
        }

        .jupiter .planet {
            width: 36px;
            height: 36px;
            background: linear-gradient(#d2b48c, #b87333);
        }

        /* Saturn with rings */
        .saturn .planet {
            width: 30px;
            height: 30px;
            background: #d2b48c;
            position: relative;
        }

        .saturn .planet::before {
            content: "";
            position: absolute;
            width: 60px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(20deg);
        }

        .uranus .planet {
            width: 24px;
            height: 24px;
            background: #7fdbda;
        }

        .neptune .planet {
            width: 24px;
            height: 24px;
            background: #4169e1;
        }

        /* Info */
        .info {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 280px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="universe">
        <div class="sun"></div>

        <div class="orbit mercury">
            <div class="planet"></div>
        </div>
        <div class="orbit venus">
            <div class="planet"></div>
        </div>
        <div class="orbit earth">
            <div class="planet"></div>
        </div>
        <div class="orbit mars">
            <div class="planet"></div>
        </div>
        <div class="orbit jupiter">
            <div class="planet"></div>
        </div>
        <div class="orbit saturn">
            <div class="planet"></div>
        </div>
        <div class="orbit uranus">
            <div class="planet"></div>
        </div>
        <div class="orbit neptune">
            <div class="planet"></div>
        </div>
    </div>

    <div class="info">
        <h3>Solar System</h3>
        <p>All 8 planets with realistic spacing and orbital speeds.</p>
    </div>

</body>

</html>
